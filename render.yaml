# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: paybridge-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's proxy sets X-Forwarded-For; per-IP rate limits need the real client IP.
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: paybridge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paybridge-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Daraja credentials: set these in the Render dashboard, never in git.
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_ENV
        value: sandbox
      # The service's public URL, e.g. https://paybridge-api.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false

  - type: keyvalue
    name: paybridge-redis
    plan: free
    ipAllowList: [] # only reachable from services in this Render account

databases:
  - name: paybridge-db
    plan: free
